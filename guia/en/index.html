<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Audio Guide | La Aldea Mágica</title>
<meta name="description" content="English audio guide for La Casa del Duende and La Aldea Mágica in Baños de Agua Santa, Ecuador.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#101b16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--forest:#101b16;--cream:#f5efe3;--muted:#ddd2bf;--gold:#d4af37;--gold2:#f0d77a;--line:rgba(240,215,122,.28)}*{box-sizing:border-box}html{min-height:100%;background:var(--forest)}body{min-height:100vh;min-height:100svh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));color:var(--cream);font-family:'Lora',Georgia,serif;background:linear-gradient(180deg,rgba(5,10,7,.54),rgba(5,10,7,.9)),url('https://res.cloudinary.com/dykjwnszb/image/upload/f_auto,q_auto,w_1400/v1750823397/La_casa_del_Duende_Banos_hlghri.jpg') center/cover fixed}.shell{width:min(100%,520px)}.card{position:relative;overflow:hidden;padding:clamp(25px,7vw,40px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(28,45,36,.94),rgba(13,23,18,.84));box-shadow:0 28px 80px rgba(0,0,0,.44);backdrop-filter:blur(18px)}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.08),transparent 35%)}.brand{margin:0 0 26px;text-align:center;color:var(--gold2);font-family:'Cinzel',serif;font-size:.75rem;font-weight:600;letter-spacing:.17em;text-transform:uppercase}.station{width:max-content;margin:0 auto 14px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.04);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}h1{max-width:430px;margin:0 auto;text-align:center;font-family:'Cinzel',serif;font-size:clamp(1.65rem,7vw,2.45rem);font-weight:600;line-height:1.16;text-wrap:balance}.subtitle,.hint{text-align:center;color:var(--muted)}.subtitle{margin:13px 0 0;font-size:.93rem}.play-zone{position:relative;display:grid;place-items:center;width:154px;height:154px;margin:32px auto 28px;border:1px solid rgba(240,215,122,.18);border-radius:50%}.play-zone:after{content:"";position:absolute;inset:17px;border:1px solid rgba(240,215,122,.18);border-radius:50%}.play{z-index:2;width:94px;height:94px;border:1px solid rgba(255,255,255,.35);border-radius:50%;color:var(--forest);background:linear-gradient(145deg,var(--gold2),var(--gold));box-shadow:0 14px 38px rgba(0,0,0,.35),0 0 0 9px rgba(212,175,55,.08);font-size:2rem;cursor:pointer;transition:.2s}.play:hover{transform:scale(1.04)}.play:active{transform:scale(.97)}.play:focus-visible{outline:3px solid #fff;outline-offset:5px}.progress{width:100%;height:8px;appearance:none;border-radius:999px;background:linear-gradient(to right,var(--gold) 0,var(--gold) var(--played,0%),rgba(255,255,255,.14) var(--played,0%),rgba(255,255,255,.14) 100%);cursor:pointer}.progress::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border:3px solid #1b2d24;border-radius:50%;background:var(--gold2)}.progress::-moz-range-thumb{width:13px;height:13px;border:3px solid #1b2d24;border-radius:50%;background:var(--gold2)}.times{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}.actions{text-align:center;margin-top:23px}.restart{padding:10px 15px;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.05);font:600 .84rem 'Lora',serif;cursor:pointer}.hint{margin:23px 0 0;font-size:.79rem;opacity:.78}.empty{display:none;text-align:center}.empty p{color:var(--muted)}.site{display:block;width:max-content;margin:21px auto 0;color:var(--gold2);font-size:.82rem;text-decoration:none}.site:hover{text-decoration:underline;text-underline-offset:4px}audio{display:none}@media(max-width:390px){.card{padding:24px 20px 28px;border-radius:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<section class="card" aria-labelledby="title">
<p class="brand">La Aldea Mágica · English Audio Guide</p>
<div id="content">
<p class="station" id="station">Station</p>
<h1 id="title">Loading…</h1>
<p class="subtitle">Baños de Agua Santa, Ecuador</p>
<div class="play-zone"><button class="play" id="play" type="button" aria-label="Play audio">▶</button></div>
<label for="progress" style="position:absolute;left:-9999px">Audio progress</label>
<input class="progress" id="progress" type="range" min="0" max="100" value="0" step="0.1">
<div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
<div class="actions"><button class="restart" id="restart" type="button">↺ Start again</button></div>
<p class="hint">Tap play and use your device volume. Headphones are recommended.</p>
</div>
<div class="empty" id="empty"><p class="station">English Audio Guide</p><h1>Scan a station QR code</h1><p>This page opens the audio assigned to each point of the visit.</p></div>
<audio id="audio" preload="metadata" playsinline></audio>
</section>
<a class="site" href="/">La Casa del Duende</a>
</main>
<script>
const tracks={
"01":["Welcome to La Aldea Mágica","01-welcome.mp3"],
"02":["Before You Enter","02-before-you-enter.mp3"],
"03":["A Territory of Nature and Imagination","03-territory-and-imagination.mp3"],
"04":["The Journey That Started It All","04-the-journey.mp3"],
"05":["La Casa del Duende: Where the Story Took Root","05-la-casa-del-duende.mp3"],
"06":["What Is a Duende?","06-what-is-a-duende.mp3"],
"07":["How a Character Is Born","07-how-a-character-is-born.mp3"],
"08":["The Language of Their Faces","08-language-of-their-faces.mp3"],
"09":["La Aldea Mágica: A Living Garden","09-a-living-garden.mp3"],
"10":["Cultural Duendism","10-cultural-duendism.mp3"],
"11":["The Ethics of Kindness","11-ethics-of-kindness.mp3"],
"12":["Take the Story With You","12-take-the-story-with-you.mp3"]};
const raw=(new URLSearchParams(location.search).get('station')||'').replace(/\D/g,'');
const id=raw?raw.padStart(2,'0'):'';const track=tracks[id];
const audio=document.getElementById('audio'),play=document.getElementById('play'),progress=document.getElementById('progress'),current=document.getElementById('current'),duration=document.getElementById('duration');
const time=s=>{if(!Number.isFinite(s))return'0:00';return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0')};
const state=playing=>{play.textContent=playing?'❚❚':'▶';play.setAttribute('aria-label',playing?'Pause audio':'Play audio')};
if(!track){document.getElementById('content').style.display='none';document.getElementById('empty').style.display='block'}else{
document.getElementById('station').textContent=`Station ${Number(id)} of 12`;document.getElementById('title').textContent=track[0];document.title=`Station ${Number(id)} — ${track[0]} | La Aldea Mágica`;audio.src=`/guia/audio/en/${track[1]}`;
play.onclick=async()=>{try{audio.paused?await audio.play():audio.pause()}catch(e){state(false)}};
document.getElementById('restart').onclick=async()=>{audio.currentTime=0;try{await audio.play()}catch(e){state(false)}};
audio.onplay=()=>state(true);audio.onpause=()=>state(false);audio.onloadedmetadata=()=>duration.textContent=time(audio.duration);
audio.ontimeupdate=()=>{const p=audio.duration?audio.currentTime/audio.duration*100:0;progress.value=p;progress.style.setProperty('--played',p+'%');current.textContent=time(audio.currentTime)};
progress.oninput=()=>{if(audio.duration)audio.currentTime=Number(progress.value)/100*audio.duration;progress.style.setProperty('--played',progress.value+'%')};
audio.onended=()=>{state(false);audio.currentTime=0};audio.onerror=()=>{document.getElementById('title').textContent='Audio temporarily unavailable';play.disabled=true};}
</script>
</body>
</html>
